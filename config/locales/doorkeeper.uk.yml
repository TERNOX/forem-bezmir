        redirect_uri: "Один URI на рядок"
        blank_redirect_uri: "Залиште порожнім, якщо ви налаштували провайдера на Client Credentials, Resource Owner Password Credentials або інший тип дозволу, що не потребує URI перенаправлення."
        scopes: "Розділяйте області доступу пробілами. Залиште порожнім, щоб використати області за замовчуванням."
      edit:
        title: "Редагувати застосунок"
      index:
        title: "Ваші застосунки"
        new: "Новий застосунок"
        name: "Назва"
        callback_url: "URL зворотного виклику"
        confidential: "Конфіденційний?"
        actions: "Дії"
        confidentiality:
