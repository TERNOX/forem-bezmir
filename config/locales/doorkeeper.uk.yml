    flash:
      applications:
        create:
          notice: "Застосунок створено."
        destroy:
          notice: "Застосунок видалено."
        update:
          notice: "Застосунок оновлено."
      authorized_applications:
        destroy:
          notice: "Доступ застосунку відкликано."
    layouts:
      admin:
        title: "Doorkeeper"
        nav:
          oauth2_provider: "Провайдер OAuth2"
          applications: "Застосунки"
          home: "Головна"
      application:
        title: "Потрібна авторизація OAuth"
  activerecord:
