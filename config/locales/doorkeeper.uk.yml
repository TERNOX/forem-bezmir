          'no': "Ні"
      new:
        title: "Новий застосунок"
      show:
        title: "Застосунок: %{name}"
        application_id: "UID:"
        secret: "Секрет:"
        secret_hashed: "Хешований секрет"
        scopes: "Області доступу:"
        confidential: "Конфіденційний:"
        callback_urls: "URL зворотного виклику:"
        actions: "Дії"
        not_defined: "Не визначено"
