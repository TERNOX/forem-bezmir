# Ukrainian strings for the OAuth/OIDC consent flow.
#
# Only the visitor-facing part is translated: the consent screen and the errors
# a visitor can actually hit. Doorkeeper's application CRUD under
# /oauth/applications is super-admin-only and falls back to English on purpose —
# a machine translation of admin plumbing would be worse than the original.
uk:
  doorkeeper:
    admin:
      not_authorized: 'Недостатньо прав'
    authorizations:
      buttons:
        authorize: 'Дозволити'
        deny: 'Відхилити'
      error:
        title: 'Сталася помилка'
      new:
        title: 'Потрібен дозвіл'
        prompt: 'Дозволити «%{client_name}» користуватися вашим акаунтом?'
        able_to: 'Цей застосунок зможе:'
      show:
        title: 'Код авторизації:'
      form_post:
        title: 'Надішліть цю форму'

    authorized_applications:
      confirmations:
        revoke: 'Ви впевнені?'
      buttons:
        revoke: 'Відкликати'
      index:
        title: 'Застосунки з доступом до вашого акаунта'
        application: 'Застосунок'
        created_at: 'Надано'
        date_format: '%d.%m.%Y %H:%M'

    scopes:
      openid: 'Підтвердити, що акаунт ваш'
      profile: 'Бачити ваші імʼя та нікнейм'
      email: 'Бачити вашу електронну пошту'

    errors:
      messages:
        invalid_request:
          unknown: 'У запиті бракує обовʼязкового параметра, або він некоректний.'
          missing_param: 'Бракує обовʼязкового параметра: %{value}.'
          request_not_authorized: 'Запит потребує авторизації: обовʼязковий параметр відсутній або недійсний.'
          invalid_code_challenge: "Потрібен code challenge."
          multiple_client_auth_methods: "Запит використовує більше ніж один механізм автентифікації клієнта."
        invalid_redirect_uri: 'Адреса повернення некоректна або не збігається з тією, що вказана для застосунку.'
        unauthorized_client: 'Застосунку не дозволено виконувати цей запит у такий спосіб.'
        access_denied: 'Ви відхилили запит.'
        invalid_scope: 'Запитано доступ, якого цей застосунок не має.'
        server_error: 'Сервер авторизації натрапив на неочікувану помилку.'
        temporarily_unavailable: 'Сервер авторизації тимчасово недоступний.'
        invalid_code_challenge_method:
          zero: "Сервер авторизації не підтримує PKCE, оскільки не приймає жодного значення code_challenge_method."
          one: "code_challenge_method має бути %{challenge_methods}."
          few: "code_challenge_method має бути одним із: %{challenge_methods}."
          many: "code_challenge_method має бути одним із: %{challenge_methods}."
          other: "code_challenge_method має бути одним із: %{challenge_methods}."
        credential_flow_not_configured: "Потік Resource Owner Password Credentials не спрацював, бо Doorkeeper.configure.resource_owner_from_credentials не налаштовано."
        resource_owner_authenticator_not_configured: "Пошук Resource Owner не вдався, бо Doorkeeper.configure.resource_owner_authenticator не налаштовано."
        admin_authenticator_not_configured: "Доступ до панелі адміністратора заборонено, бо Doorkeeper.configure.admin_authenticator не налаштовано."
        unsupported_response_type: "Сервер авторизації не підтримує цей тип відповіді."
        unsupported_response_mode: "Сервер авторизації не підтримує цей режим відповіді."
        invalid_client: "Не вдалося автентифікувати клієнта: клієнт невідомий, автентифікацію клієнта не передано або метод автентифікації не підтримується."
        invalid_grant: "Наданий дозвіл на авторизацію недійсний, прострочений, відкликаний, не відповідає URI перенаправлення із запиту авторизації або виданий іншому клієнту."
        unsupported_grant_type: "Сервер авторизації не підтримує цей тип дозволу."
        invalid_token:
          revoked: "Токен доступу відкликано"
          expired: "Термін дії токена доступу минув"
          unknown: "Токен доступу недійсний"
        revoke:
          unauthorized: "Ви не маєте права відкликати цей токен"
        forbidden_token:
          missing_scope: "Для доступу до цього ресурсу потрібна область доступу «%{oauth_scopes}»."
