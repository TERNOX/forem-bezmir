          content_spec:
            description: "Внутрішній опис вмісту, який загалом вважається доречним для спільноти. Пишіть якомога докладніше, щоб відрізнити її від інших спільнот."
            placeholder: "Напр.: «Місце, де розробники діляться своєю роботою, ставлять запитання й навчаються один в одного…» — але значно довше й конкретніше"
          ai_moderation:
            title: "ШІ-модерація спаму (Gemini)"
            description: "Коли увімкнено, Gemini оцінює кожен новий або відредагований допис і додатково перевіряє дописи й коментарі з посиланнями. Явний спам, шкідливий чи підбурювальний вміст отримує прапорець від маскота (−50 до рейтингу). Якщо вимкнути, залишаться лише тригерні фрази й перевірка поганих доменів, а також вимкнуться ШІ-мітки якості (бонус до рейтингу для хороших дописів)."
            key_present: "Ключ Gemini API знайдено — ШІ-модерація може працювати."
            key_missing: "Ключ Gemini API (GEMINI_API_KEY) не налаштовано — ШІ-модерація не працює, незалежно від цієї галочки."
          ai_model:
            title: "Модель Gemini для модерації"
            description: "Залиште порожнім, щоб використовувати модель сервера за замовчуванням (%{model}). Рекомендовано: модель Flash, наприклад gemini-2.5-flash — дешева, швидка й достатньо точна для рішення «спам чи ні». Моделі Flash-Lite найдешевші, але частіше помиляються на спірних дописах; моделі Pro найточніші, але в рази дорожчі. Актуальні назви моделей: ai.google.dev/gemini-api/docs/models."
            placeholder: "gemini-2.5-flash"
          ai_setup:
            title: "Як підключити Gemini"
            steps:
              - "Створіть API-ключ на https://aistudio.google.com/apikey."
              - "Додайте GEMINI_API_KEY=<ваш ключ> у змінні середовища сервера (файл .env або змінні Docker/хостингу). З міркувань безпеки ключ не зберігається в адмінці."
              - "Перезапустіть вебсервер і Sidekiq, щоб вони підхопили ключ."
              - "Заповніть опис вмісту вище: ШІ за ним вирішує, що відповідає тематиці, і розмитий опис — головна причина хибних позначок спаму."
          exempt_users:
            title: "Білий список: користувачі"
