---
uk:
  lib:
    constants:
      settings:
        general:
          news_sitemap_tags:
            description: "Укажіть теги (через кому), які роблять статтю частиною News sitemap."
            placeholder: "новини,огляди"
          news_sitemap_organization_ids:
            description: "Укажіть ID організацій (через кому), чиї дописи можуть потрапити до News sitemap."
            placeholder: "2,5"
          video_upload_access_key_id:
            description: AWS access key ID used to sign direct uploads for raw video files
            placeholder: AKIA************
          video_upload_secret_access_key:
            description: AWS secret access key paired with the access key ID for direct uploads
            placeholder: your-secret-access-key
          video_upload_bucket:
            description: Name of the S3 bucket where members upload raw video files before encoding
            placeholder: forem-video-uploads
          video_upload_region:
            description: AWS region for the upload bucket (for example, us-east-1)
            placeholder: us-east-1
          video_upload_custom_endpoint:
            description: Optional custom S3 endpoint to use for uploads (leave blank to use the AWS default)
            placeholder: https://s3.amazonaws.com/your-bucket/
          video_cdn_base_url:
            description: Base URL that serves encoded video streams and thumbnails
            placeholder: https://videos.example.com
