            placeholder: "ben, jess"
          exempt_orgs:
            title: "Білий список: організації"
            description: "Slug організацій через кому, як в адресі (наприклад, my-org у /my-org). Маскот ніколи не позначає як спам дописи, опубліковані від імені цих організацій."
            placeholder: "my-org, partner-team"
