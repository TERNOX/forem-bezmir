# Original locale: lib/en.yml
---
uk:
  lib:
    constants:
      settings:
        authentication:
          allowed:
            description: Restrict registration до only certain emails? (comma-separated list)
            placeholder: dev.до, forem.com, codenewbie.org
          apple_client:
            description: The "App Bundle" code для the Authentication Service configured у the Apple Developer Portal
          apple_key:
            description: The "Key ID" від the Authentication Service configured у the Apple Developer Portal
          apple_pem:
            description: The "PEM" key від the Authentication Service configured у the Apple Developer Portal
          apple_team:
            description: The "Команда ID" з ваш Apple Developer Account
          blocked:
            description: Заблокувати registration від specified domains?  (comma-separated list)
          display_list:
            description: Do ви want до display the list з allowed domains, або keep it private?
          facebook_key:
            description: The "App ID" portion з the Basic Налаштування section з the App сторінка на the Facebook Developer Portal
          facebook_secret:
            description: The "App Secret" portion з the Basic Налаштування section з the App сторінка на the Facebook Developer Portal
          forem_key:
            description: Forem key
          forem_secret:
            description: Forem secret
          github_key:
            description: The "Client ID" portion з the GitHub Oauth Apps portal
          github_secret:
            description: The "Client Secret" portion з the GitHub Oauth Apps portal
          google_key:
            description: The "Client ID" portion з the OAuth 2.0 сторінка на the Google Cloud Platform portal
          google_secret:
            description: The "Client Secret" portion з the OAuth 2.0 сторінка на the Google Cloud Platform portal
          invite_only:
            description: Only користувачі invited від email можемо join this community.
          new_user_status:
            description: What status do ви want до apply до new користувачі?
            placeholder: Good standing
          providers:
            description: How можемо користувачі sign у?
          recaptcha_secret:
            description: Додати the secret key для Google reCAPTCHA, which є used для reporting abuse
            placeholder: What є the Google reCAPTCHA secret key?
          recaptcha_site:
            description: Додати the site key для Google reCAPTCHA, which є used для reporting abuse
            placeholder: What є the Google reCAPTCHA site key?
          require_recaptcha:
            description: People will be required до fill out a captcha when they're creating a new account у ваш community
          twitter_key:
            description: The "API key" portion з consumer keys у the Twitter developer portal.
          twitter_secret:
            description: The "API secret key" portion з consumer keys у the Twitter developer portal.
        campaign:
          articles_approval:
            placeholder: Campaign stories show up на sidebar з approval?
          articles_expiry:
            description: Sets the expiry time для articles (у weeks) до be displayed у campaign sidebar
          call_to_action:
            description: This text populates the call до action button на the campaign sidebar
            placeholder: Поділитися ваш project
          display_name:
            description: This text є displayed у reference до the campaign у titles, etc.
            placeholder: My great campaign
          featured:
            description: Публікації з which tags will be featured у the campaign sidebar (comma separated, letters only)
            placeholder: 'List з campaign tags: comma separated, letters only e.g. shecoded,theycoded'
          hero_html:
            description: Hero HtmlVariant name
          sidebar_enabled:
            placeholder: Campaign sidebar enabled або not
          sidebar_image:
            placeholder: Used о the top з the campaign sidebar
          url:
            description: https://url.com/lander
            placeholder: URL campaign sidebar image will link до
        community:
          copyright:
            description: Used до mark the рік this forem was started.
          description:
            description: Used у meta description tags etc.
            placeholder: A fabulous community з kind і welcoming people.
          emoji:
            description: Used у the title tags across the site alongside the community name
          member:
            description: Used до determine what a учасник will be called e.g developer, hobbyist etc.
            placeholder: користувач
          name:
            description: Used as the primary name для ваш Forem, e.g. DEV, DEV Спільнота, The DEV Спільнота, etc.
            placeholder: Новий Forem
          staff:
            description: Account which acts as automated 'staff'— used principally для ласкаво просимо thread.
          tagline:
            description: Used у signup modal.
            placeholder: Ми're a place where coders share, stay up-до-date і grow their careers.
        general:
          ahoy_tracking:
            description: Track visits і events - data є stored у ваш database. A restart є required для changes до this configuration до take effect.
          billboard_enabled_countries:
            description: Countries that можемо be geotargeted від billboards. Click на a selected country до toggle targeting на a sub-country level.
          contact_email:
            description: Used для contact links. Будь ласка provide an email address where користувачі можемо get у touch з ви або ваш команда.
          credit:
            large:
              description: Price для large credit purchase (100 - 999 credits).
            medium:
              description: Price для medium credit purchase (10 - 99 credits).
            small:
              description: Price для small credit purchase (<10 credits).
            xlarge:
              description: Price для extra large credit purchase (1000 credits або more).
          favicon:
            description: Used as the site favicon
          ga_tracking:
            description: Google Universal Analytics Tracking ID, e.g. UA-XXXXXXXX-1
          ga_analytics_4:
            description: Google Analytics 4 Measurement ID, e.g. G-XXXXXXXXX
          cookie_banner_user_context:
            description: Used до determine whether the cookie banner should be shown based на користувач context (i.e. logged у або not)
          coolie_banner_platform_context:
            description: Used до determine whether the cookie banner should be shown based на platform (i.e. web/mobile)
          hashtag:
            description: Used as the twitter hashtag з the community
            placeholder: "#DEVСпільнота"
          health:
            description: Used до authenticate з ваш health check endpoints.
            placeholder: a secure token
          logo_png:
            description: Used as a secondary logo у places like the sign у modals, onboarding, Apple touch icons. Recommended minimum з 512x512px
          logo_svg:
            description: This є the logo currently used на the upper left-hand corner з ваш Forem. However, after the release it will be deprecated у favor з the Logo above.
          mailchimp_api:
            description: API key used до connect Mailchimp account. Found у Mailchimp backend
          mailchimp_mod:
            description: Спільнота Moderators Новийsletter ID
          mailchimp_news:
            description: Main Новийsletter ID, also known as Audience ID
          mailchimp_tag_mod:
            description: Тег Moderators Новийsletter ID
          main_social:
            description: Used as the main image у social networks і OpenGraph. Recommended aspect ratio з 16:9 (600x337px,1200x675px)
          mascot_image:
            description: Used as the mascot image.
          mascot_user:
            description: The Mascot account
          meta_keywords:
            description: 'List з valid keywords: comma separated, letters only e.g. engineering, development'
          onboarding_newsletter_content:
            description: Use this field до set the title і subtitle для ваш newsletter offering step. Keep it concise.
            placeholder: Ви можемо configure image, title і subtitle via markdown
          onboarding_newsletter_opt_in_head:
            description: Новийsletter checkbox heading
            placeholder: E.g., Так, subscribe me до the weekly newsletter
          onboarding_newsletter_opt_in_subhead:
            description: Новийsletter checkbox subheading
            placeholder: E.g., Rest assured, ми respect ваш privacy. Ваш email will only be used для our newsletter і won't be shared з others.
          geos_with_allowed_default_email_opt_in:
            description: List з countries where the default email opt-у є allowed від адмін
            placeholder: 'List з valid countries: comma separated, letters only e.g. US,CA'
          payment:
            description: 'Used для site-wide web monetization. See: https://github.com/forem/forem/pull/6345'
          periodic:
            description: Determines how often periodic email digests are sent (у дні)
          sidebar:
            description: Determines which tags are shown на the homepage right-hand sidebar
            placeholder: List з valid, comma-separated tags e.g. допомога,discuss,explainlikeimfive,meta
          stripe_api:
            description: 'Secret Stripe key для receiving payments. See: https://stripe.com/docs/keys'
          stripe_key:
            description: 'Public Stripe key для receiving payments. See: https://stripe.com/docs/keys'
          tags:
            description: Determines which tags are suggested до new користувачі during onboarding (comma separated, letters only)
            placeholder: 'List з valid tags: comma separated, letters only e.g. beginners,javascript,ruby,swift,kotlin'
          video:
            description: Secret key used до allow AWS video encoding through the VideoStatesController
        rate_limit:
          new_days:
            description: The number з дні a користувач є considered new. The default є 3 дні, but ви можемо disable this entirely від inputting 0.
          spam:
            description: Individual (case insensitive) phrases that trigger spam alerts, comma separated.
            placeholder: used cars near ви, pokemon go hack
          content_spec:
            description: Internal description з content which є considered generally "на-topic" — be very descriptive до best differentiate від other communities..
            placeholder: e.g. "A place для developers до share their work, ask запитання, і learn від each other.... But much longer і more specific"
        smtp:
          address:
            description: Додатиress з the remote mail server
            placeholder: i.e. smtp.gmail.com
          authentication:
            description: Якщо ваш mail server requires authentication, ви need до specify the authentication type тут
            placeholder: i.e. plain, login, або cram_md5
          domain:
            description: Якщо ви need до specify a HELO domain, ви можемо do it тут
          password:
            description: Якщо ваш mail server requires authentication, copy the password від ваш server
          port:
            description: The port that ваш mail server runs на
            placeholder: '25'
          user_name:
            description: Якщо ваш mail server requires authentication, copy the username від ваш server
          from_email:
            description: The email address that emails should be sent від
          reply_to:
            description: The email address that користувачі можемо reply до
        user_experience:
          default_font:
            description: Determines the default reading font (registered користувачі можемо change this у their UX settings)
          default_locale:
            description: Determines the default language і localization для the Forem (currently у experimental beta)
          feed_strategy:
            description: 'Determines the main feed algorithm approach the app takes: basic або large_forem_experimental (which should only be used для 10k+ учасник communities)'
            placeholder: basic
          feed_style:
            description: Determines which default feed the користувачі sees (rich content, more minimal, etc.)
            placeholder: basic, rich, або compact
          cover_image_height:
            description: Determines the height з cover images, relative до a width з 1000px
            placeholder: '420'
          cover_image_fit:
            description: Determines the cropping strategy для cover images
            placeholder: crop, limit
          feed_lookback_days:
            description: Determines how far back the feed looks для new posts (у дні)
            placeholder: '10'
          home_feed:
            description: Minimum score needed для a post до show up на the unauthenticated головна сторінка.
          index_minimum_date:
            description: Minimum date needed для a post до be indexed від search engines (Unix Timestamp).
          index_minimum_score:
            description: Minimum score needed для a post до be indexed від search engines.
          primary_hex:
            description: Determines background/border з buttons etc. Must be dark enough до contrast з white text.
          tag_feed:
            description: Minimum score needed для a post до show up на default tag сторінка.
          head_content:
            description: Content that will be appended до the bottom з the head tag на every сторінка (WARNING — This will cache within the сторінка request unevenly. Proceed з care).
            placeholder: Leave empty якщо ви do not want до add щось.
          bottom_of_body_content:
            description: Content that will be appended до the bottom з the body tag на every сторінка (WARNING — This will cache within the сторінка request unevenly. Proceed з care).
            placeholder: Leave empty якщо ви do not want до add щось.
