en:
  views:
    admin:
      tools:
        reputation:
          heading: Recalculate reputation
          description_html: "<strong>Resets</strong> all member reputation scores to match the number of likes their posts and comments have received."
          submit: Recalculate now
          success: "Recalculated reputation for %{users} members using %{likes} total post and comment likes."
        resave_published:
          heading: Rebuild embeds in published articles
          description_html: "Enqueue a background job to <strong>resave every currently published article</strong> so that embedded media is rebuilt. Drafts and scheduled posts are skipped."
          submit: Resave published articles
        monthly_top_users:
          heading: Monthly Top Users badges
          description_html: "Configure which badge is awarded to the monthly top 10 users and when the award job should run. The job always evaluates the previous month's leaderboard."
          form:
            badge_slug: Badge slug
            badge_slug_help: "This badge must exist and allow multiple awards."
            award_day: Award day of the month
            award_day_help: "Badges will be issued on this day for the previous month."
            award_time: Award time (UTC)
            award_time_help: "Badges will be awarded at this time on the selected day."
            message_template: Notification message template
            message_template_help_html: "Use placeholders like <code>%%{period}</code>, <code>%%{month}</code>, and <code>%%{year}</code> to insert the localized month, standalone month name, and year."
            save: Save monthly top users settings
          next_run: "Next run: %{timestamp}"
          placeholders:
            heading: Available placeholders
            items:
              - "<code>%%{period}</code> – full month name with year (e.g. <code>October 2024</code>)"
              - "<code>%%{month}</code> – standalone localized month name (e.g. <code>October</code>)"
              - "<code>%%{year}</code> – four-digit year"
          status:
            heading: Latest awards
            last_run: "Last awarded for %{period} on %{timestamp}."
            recipients_html: "Awarded to %{usernames}."
            message_html: "Message: %{message}"
            empty: "Monthly top user badges have not been awarded yet."
          save_success: Monthly top users settings updated.
          errors:
            invalid_day: "Choose a day between 1 and 31."
        top_seven:
          heading: Weekly Top 7 preview
          description_html: "Preview the seven most reacted posts for each week. These are the articles that will be considered when awarding the Top 7 badge."
          empty_state: "No Top 7 selections have been recorded yet."
        top_articles_digest:
          heading: Automated Top Articles digest
          description_html: "Configure the community bot that will publish the digest and the template that should be used for each post."
          form:
            bot_api_key: Community Bot API key
            bot_api_key_help: "Use the API key of the bot account that should publish the digest."
            title_template: Post title template
            title_template_help_html: "Use Liquid-style tokens like <code>{{generated_on}}</code>, <code>{{period_start}}</code>, <code>{{period_end}}</code>, <code>{{count}}</code>, and <code>{{frequency}}</code> to insert dynamic values."
            tags: Tags (comma or newline separated)
            tags_help: "These tags will be applied to each digest post."
            image_url: Cover image URL
            organization_id: Organization ID (optional)
            organization_help: "The bot must belong to the organization. Leave blank to publish from the bot's personal profile."
            excluded_organization_ids: Excluded organization IDs
            excluded_organization_ids_help: "Comma-separated list of organization IDs to ignore (e.g. 1,2,5,7). Articles from these organizations are omitted from the digest and badge awards."
            intro_markdown: First paragraph of the post
            frequency: How often should the digest be published?
            frequency_options:
              daily: Daily (previous day)
              weekly: Weekly (previous week)
              monthly: Monthly (previous month)
            publish_time: Publication time (UTC)
            publish_time_help: "Choose the hour and minute when the digest article should be published."
            article_limit: Number of articles to include
            badge_slug: Badge slug to reward the authors
            badge_time: Badge award time (UTC)
            badge_time_help: "Choose the hour and minute when the Top 7 badges should be awarded."
            save: Save digest settings
          placeholders:
            heading: Available template placeholders
            items:
              - "<code>{{generated_on}}</code> – the date the digest is published"
              - "<code>{{period_start}}</code> – the start date of the period"
              - "<code>{{period_end}}</code> – the end date of the period"
              - "<code>{{count}}</code> – the number of posts that will be embedded"
              - "<code>{{frequency}}</code> – the selected cadence (daily, weekly, monthly)"
          preview:
            heading: Next digest preview
            summary: "%{count} posts selected for %{range}."
            empty_state: "Configure the digest settings to generate a preview."
            mode_label: Preview range
            mode_help: "Choose whether to preview the next scheduled digest or a custom date range."
            mode_options:
              settings: Use digest frequency setting
              custom: Custom date range
            start_date: Start date (inclusive)
            end_date: End date (inclusive)
            update: Update preview
            missing_range: "Select both a start and end date to generate the preview."
            invalid_range: "The selected preview range is invalid. Double-check the start and end dates."
            test_publish:
              button: Publish test digest
              success: "Test digest posted successfully. <a href='%{path}'>View article</a>."
              failure: "The test digest could not be published."
            test_badges:
              button: Award badges to previewed authors
              success: "Awarded badges to %{count} authors."
              missing_articles: "No articles were available for the selected period."
              missing_authors: "The previewed articles do not have eligible authors."
