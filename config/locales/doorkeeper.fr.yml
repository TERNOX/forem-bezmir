# French strings for the OAuth/OIDC consent flow.
#
# Only the visitor-facing part is translated: the consent screen and the errors
# a visitor can actually hit. Doorkeeper's application CRUD under
# /oauth/applications is super-admin-only and falls back to English on purpose.
fr:
  doorkeeper:
    admin:
      not_authorized: "Vous n'êtes pas autorisé à effectuer cette action"
    authorizations:
      buttons:
        authorize: 'Autoriser'
        deny: 'Refuser'
      error:
        title: "Une erreur s'est produite"
      new:
        title: 'Autorisation requise'
        prompt: 'Autoriser « %{client_name} » à utiliser votre compte ?'
        able_to: 'Cette application pourra :'
      show:
        title: "Code d'autorisation :"
      form_post:
        title: 'Envoyer ce formulaire'

    authorized_applications:
      confirmations:
        revoke: 'Êtes-vous sûr ?'
      buttons:
        revoke: 'Révoquer'
      index:
        title: 'Applications autorisées'
        application: 'Application'
        created_at: 'Autorisée le'
        date_format: '%d/%m/%Y %H:%M'

    scopes:
      openid: 'Confirmer que ce compte est le vôtre'
      profile: 'Voir votre nom et votre nom d’utilisateur'
      email: 'Voir votre adresse e-mail'

    errors:
      messages:
        invalid_request:
          unknown: "La requête est incomplète ou mal formée."
          missing_param: 'Paramètre obligatoire manquant : %{value}.'
          request_not_authorized: "La requête doit être autorisée : un paramètre obligatoire est manquant ou invalide."
          invalid_code_challenge: "Le code challenge est requis."
          multiple_client_auth_methods: "La requête utilise plus d'un mécanisme d'authentification du client."
        invalid_redirect_uri: "L'URI de redirection est mal formée ou ne correspond pas à celle de l'application."
        unauthorized_client: "L'application n'est pas autorisée à effectuer cette requête de cette manière."
        access_denied: 'Vous avez refusé la demande.'
        invalid_scope: "L'accès demandé n'est pas accordé à cette application."
        server_error: "Le serveur d'autorisation a rencontré une erreur inattendue."
        temporarily_unavailable: "Le serveur d'autorisation est temporairement indisponible."
        invalid_code_challenge_method:
          zero: "Le serveur d'autorisation ne prend pas en charge PKCE, car aucune valeur code_challenge_method n'est acceptée."
          one: "Le code_challenge_method doit être %{challenge_methods}."
          other: "Le code_challenge_method doit être l'un des suivants : %{challenge_methods}."
        credential_flow_not_configured: "Le flux Resource Owner Password Credentials a échoué car Doorkeeper.configure.resource_owner_from_credentials n'est pas configuré."
        resource_owner_authenticator_not_configured: "La recherche du Resource Owner a échoué car Doorkeeper.configure.resource_owner_authenticator n'est pas configuré."
        admin_authenticator_not_configured: "L'accès au panneau d'administration est interdit car Doorkeeper.configure.admin_authenticator n'est pas configuré."
        unsupported_response_type: "Le serveur d'autorisation ne prend pas en charge ce type de réponse."
        unsupported_response_mode: "Le serveur d'autorisation ne prend pas en charge ce mode de réponse."
        invalid_client: "L'authentification du client a échoué : client inconnu, aucune authentification du client fournie ou méthode d'authentification non prise en charge."
        invalid_grant: "L'autorisation fournie est invalide, expirée, révoquée, ne correspond pas à l'URI de redirection utilisée dans la requête d'autorisation, ou a été émise pour un autre client."
        unsupported_grant_type: "Le type d'autorisation n'est pas pris en charge par le serveur d'autorisation."
        invalid_token:
          revoked: "Le jeton d'accès a été révoqué"
          expired: "Le jeton d'accès a expiré"
          unknown: "Le jeton d'accès est invalide"
        revoke:
          unauthorized: "Vous n'êtes pas autorisé à révoquer ce jeton"
        forbidden_token:
          missing_scope: "L'accès à cette ressource nécessite la portée « %{oauth_scopes} »."
    applications:
      confirmations:
        destroy: "Êtes-vous sûr ?"
      buttons:
        edit: "Modifier"
        destroy: "Supprimer"
        submit: "Envoyer"
        cancel: "Annuler"
        authorize: "Autoriser"
      form:
        error: "Oups ! Vérifiez votre formulaire pour d'éventuelles erreurs"
      help:
